<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Hotel UASD &middot; Limpieza</title>
    <link rel="icon" type="image/png" href="assets/img/logo-hotel.png">
    <style>
        html, body {
            background: #f8fafc;
            color: #1e293b;
        }

        .app-layout {
            min-height: 100vh;
        }
    </style>
    <link rel="stylesheet" href="assets/css/estilos_limpieza.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">
                <img src="assets/img/logo-hotel.png" alt="Logo Hotel UASD" class="logo-icon-img">
            </div>
            <div class="logo-texto">
                <h2>Hotel UASD</h2>
                <small>Sistema Interno</small>
            </div>
        </div>

        <div class="sidebar-menu">
            <div class="menu-seccion">
                <div class="menu-titulo">Principal</div>
                <a href="#" class="menu-item">
                    <span class="icono">&#127968;</span>
                    <span class="texto-menu">Dashboard</span>
                </a>
            </div>

            <div class="menu-seccion">
                <div class="menu-titulo">Operaciones</div>
                <a href="index.html" class="menu-item activo">
                    <span class="icono">&#129529;</span>
                    <span class="texto-menu">Limpieza</span>
                </a>
                <a href="empleados_limpieza.html" class="menu-item">
                    <span class="icono">&#128101;</span>
                    <span class="texto-menu">Empleados</span>
                </a>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="usuario-info">
                <div class="usuario-avatar">L</div>
                <div class="usuario-datos">
                    <span class="usuario-nombre">Limpieza</span>
                    <span class="usuario-rol">Limpieza</span>
                </div>
            </div>
            <button type="button" class="btn-cerrar-sesion">Cerrar Sesi&oacute;n</button>
        </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="main-content">
        <header class="top-header">
            <div style="display:flex;align-items:center;gap:12px">
                <button class="btn-toggle-sidebar" id="toggleSidebar" title="Abrir men&uacute;">&#9776;</button>
                <h1>Limpieza</h1>
            </div>
            <div class="hora-actual" id="horaActual">--:--</div>
        </header>

        <div class="limpieza-module">
            <div class="sub-nav">
                <a href="index.html" class="sub-nav-btn-link"><span class="sub-nav-btn">Control de Habitaciones</span></a>
                <button class="sub-nav-btn activo">Asignaci&oacute;n de Limpieza</button>
                <a href="index.html#registro" class="sub-nav-btn-link"><span class="sub-nav-btn">Registro de Limpieza</span></a>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-titulo">Nueva Asignaci&oacute;n de Tarea</span>
                </div>
                <div class="panel-body">
                    <div id="mensaje" class="mensaje"></div>

                    <form id="formAsignacion" class="grid-2 form-grid-tight">
                        <div class="form-group">
                            <label for="habitacion" class="form-label">Habitaci&oacute;n</label>
                            <select id="habitacion" name="habitacion" required>
                                <option value="">Cargando habitaciones sucias...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="empleado" class="form-label">Empleado asignado</label>
                            <select id="empleado" name="empleado" required>
                                <option value="">Cargando empleados activos...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fecha" class="form-label">Fecha de asignaci&oacute;n</label>
                            <input type="date" id="fecha" name="fecha" required>
                        </div>

                        <div class="form-group">
                            <label for="hora" class="form-label">Hora de asignaci&oacute;n</label>
                            <input type="time" id="hora" name="hora" required>
                        </div>

                        <div class="form-group form-group-full form-actions-end">
                            <button type="submit" id="btnGuardar" class="btn btn-primario">Confirmar asignaci&oacute;n</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-titulo">Tareas Asignadas</span>
                </div>
                <div class="tabla-wrap">
                    <table id="tablaAsignaciones" class="modulo-table">
                        <thead>
                        <tr>
                            <th>Hab.</th>
                            <th>Empleado</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="assets/js/limpieza/asignacion.js"></script>

</body>
</html>
