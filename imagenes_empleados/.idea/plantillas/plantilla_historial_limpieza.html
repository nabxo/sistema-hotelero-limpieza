<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial de Limpieza</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #1e293b;
      margin: 28px;
    }

    p {
      margin: 0;
      color: #475569;
    }

    .header-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 18px;
    }

    .header-table td {
      border: none;
      vertical-align: top;
      padding: 0;
    }

    .header-logo-cell {
      width: 82px;
      padding-right: 14px;
    }

    .header-logo {
      width: 70px;
      height: 70px;
      display: block;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.1;
      margin: 0 0 4px 0;
    }

    .header-subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 10px 0;
    }

    .meta-line {
      font-size: 13px;
      color: #334155;
      margin: 0 0 2px 0;
    }

    .meta-line strong {
      color: #0f172a;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }

    .report-table th,
    .report-table td {
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      text-align: left;
      font-size: 12px;
    }

    .report-table th {
      background: #1e293b;
      color: #fff;
      text-transform: uppercase;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <table class="header-table">
    <tr>
      <td class="header-logo-cell">
        {{LOGO}}
      </td>
      <td>
        <p class="header-title">Hotel UASD</p>
        <p class="header-subtitle">Historial General de Limpieza</p>
        <p class="meta-line"><strong>Reporte del módulo de limpieza</strong></p>
        <p class="meta-line"><strong>Rango:</strong> {{RANGO}}</p>
        <p class="meta-line"><strong>Total de registros:</strong> {{TOTAL_REGISTROS}}</p>
      </td>
    </tr>
  </table>

  <table class="report-table">
    <thead>
      <tr>
        <th>Habitación</th>
        <th>Empleado</th>
        <th>Fecha asignación</th>
        <th>Hora asignación</th>
        <th>Fecha registro</th>
        <th>Hora registro</th>
        <th>Estado final</th>
        <th>Cumplió</th>
        <th>Observaciones</th>
      </tr>
    </thead>
    <tbody>
      {{FILAS_TABLA}}
    </tbody>
  </table>
</body>
</html>
